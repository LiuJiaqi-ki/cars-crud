name: Cars CRUD Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Download the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Playwright browsers
        run: python -m playwright install chromium

      - name: Run unit, integration, API tests
        run: python -m pytest tests/unit tests/integration tests/api -q

      - name: Run E2E tests
        run: python -m pytest tests/e2e -q